name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Verify Java environment
      run: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"
        JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $1}')
        if [ "$JAVA_VERSION" -lt 17 ]; then
          echo "Error: Java version 17 or newer is required, but found version $JAVA_VERSION"
          exit 1
        fi
        echo "Java version check passed: $JAVA_VERSION"

    - name: Setup Gradle 8.8
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.8'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Decode debug keystore
      run: |
        if [ -f ./debug.keystore.base64 ]; then
          base64 -d ./debug.keystore.base64 > ./debug.keystore
          echo "debug.keystore decoded successfully from base64."
        else
          echo "Error: debug.keystore.base64 not found!"
          exit 1
        fi
        if [ ! -f ./debug.keystore ]; then
          echo "Error: Failed to create ./debug.keystore"
          exit 1
        fi

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

    - name: Verify APK existence
      run: |
        if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "Error: app-debug.apk not found at expected path."
          echo "Searching inside app/build/outputs/apk:"
          find app/build/outputs/apk -name "*.apk"
          exit 1
        fi
        echo "APK verified successfully at app/build/outputs/apk/debug/app-debug.apk"

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Prepare APK release asset
      id: prep_asset
      run: |
        RUN_DIR=$(mktemp -d)
        cp app/build/outputs/apk/debug/app-debug.apk "$RUN_DIR/app-debug.apk"
        echo "asset_path=$RUN_DIR/app-debug.apk" >> $GITHUB_OUTPUT

    - name: Publish APK to GitHub Releases
      id: publish_release
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh --version
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        TAG="apk-v-${{ github.run_number }}-${{ github.run_attempt }}-$SHORT_SHA"
        TITLE="My File Manager APK Build #${{ github.run_number }}"
        NOTES="Automatically generated debug APK for My File Manager.
        Run Number: ${{ github.run_number }} (Attempt ${{ github.run_attempt }})
        Commit: ${{ github.sha }}"

        echo "Cleaning up any existing tag/release $TAG if present..."
        gh release delete "$TAG" --yes || true
        git push origin --delete "$TAG" || true

        echo "Creating GitHub Release $TAG..."
        gh release create "$TAG" \
          "${{ steps.prep_asset.outputs.asset_path }}" \
          --title "$TITLE" \
          --notes "$NOTES" \
          --target "${{ github.sha }}" \
          --latest || {
            echo "Release creation failed, attempting to upload as tag release..."
            gh release upload "$TAG" "${{ steps.prep_asset.outputs.asset_path }}" --clobber || true
          }

    - name: Report APK download result
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
        echo "=== DIRECT APK DOWNLOAD LINK ===" >> $GITHUB_STEP_SUMMARY
        echo "$DIRECT_URL" >> $GITHUB_STEP_SUMMARY
        echo "The APK is also available in the GitHub Actions artifacts tab as 'app-debug-apk'." >> $GITHUB_STEP_SUMMARY

        if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
          echo "Release published successfully!"
          gh release view --json tagName,name,url || true
          echo "Direct APK Download URL: $DIRECT_URL"
        else
          echo "Note: Release publishing had warnings, but APK was successfully built and archived in Actions artifacts."
        fi
