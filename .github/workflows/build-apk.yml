name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Verify Java environment
      run: |
        java -version
        echo "JAVA_HOME=$JAVA_HOME"
        JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $1}')
        if [ "$JAVA_VERSION" -lt 17 ]; then
          echo "Error: Java version 17 or newer is required, but found version $JAVA_VERSION"
          exit 1
        fi
        echo "Java version check passed: $JAVA_VERSION"

    - name: Setup Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Create temporary debug keystore
      run: |
        if [ ! -f ./debug.keystore ]; then
          echo "debug.keystore not found. Generating a new temporary debug keystore..."
          keytool -genkey -v \
            -keystore ./debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        else
          echo "debug.keystore already exists."
        fi
        if [ ! -f ./debug.keystore ]; then
          echo "Error: Failed to create ./debug.keystore"
          exit 1
        fi
        echo "Keystore verified successfully."

    - name: Build Debug APK
      run: gradle :app:assembleDebug --stacktrace --no-daemon

    - name: Verify APK existence
      run: |
        if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "Error: app-debug.apk not found at expected path."
          echo "Searching inside app/build/outputs/apk:"
          find app/build/outputs/apk -name "*.apk"
          exit 1
        fi
        echo "APK verified successfully at app/build/outputs/apk/debug/app-debug.apk"

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Prepare APK release asset
      id: prep_asset
      run: |
        RUN_DIR=$(mktemp -d)
        cp app/build/outputs/apk/debug/app-debug.apk "$RUN_DIR/app-debug.apk"
        echo "asset_path=$RUN_DIR/app-debug.apk" >> $GITHUB_OUTPUT

    - name: Publish APK to GitHub Releases
      id: publish_release
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh --version
        TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
        TITLE="Debug APK Build #${{ github.run_number }}"
        NOTES="This is an automatically generated debug APK.
        The APK was built by GitHub Actions.
        GitHub Actions run number: ${{ github.run_number }}
        GitHub Actions run attempt: ${{ github.run_attempt }}
        Source commit SHA: ${{ github.sha }}
        APK is intended for testing.
        APK is not a Play Store production release.
        APK is signed only with a temporary debug keystore."

        echo "Creating GitHub Release $TAG..."
        gh release create "$TAG" \
          "${{ steps.prep_asset.outputs.asset_path }}" \
          --title "$TITLE" \
          --notes "$NOTES" \
          --target "${{ github.sha }}" \
          --latest

    - name: Report APK download result
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
        echo "DIRECT APK DOWNLOAD" >> $GITHUB_STEP_SUMMARY
        echo "$DIRECT_URL" >> $GITHUB_STEP_SUMMARY
        echo "The normal Actions artifact app-debug-apk remains available as a backup." >> $GITHUB_STEP_SUMMARY

        if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
          echo "Release published successfully!"
          gh release view --json tagName,name,url
          echo "Direct APK Download URL: $DIRECT_URL"
        else
          echo "Warning: GitHub Release publishing failed or skipped, but the APK build succeeded."
          echo "The Actions artifact named app-debug-apk remains available."
        fi
