name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Decode debug keystore
      run: |
        if [ -f ./debug.keystore.base64 ]; then
          base64 -d ./debug.keystore.base64 > ./debug.keystore
          echo "debug.keystore decoded successfully from base64."
        else
          echo "Error: debug.keystore.base64 not found!"
          exit 1
        fi

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

    - name: Verify APK existence
      run: |
        if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "Error: app-debug.apk not found at expected path."
          find app/build/outputs/apk -name "*.apk"
          exit 1
        fi
        echo "APK verified successfully at app/build/outputs/apk/debug/app-debug.apk"

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Publish APK to GitHub Releases
      id: publish_release
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
        TAG="apk-v-${{ github.run_number }}-$SHORT_SHA"
        TITLE="File Manager APK Build #${{ github.run_number }}"
        NOTES="Automatically generated debug APK for File Manager app."

        # Delete release/tag if already exists
        gh release delete "$TAG" --yes --cleanup-tag || true
        git push origin --delete "$TAG" || true

        gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
          --title "$TITLE" \
          --notes "$NOTES" \
          --latest || echo "Release creation skipped or failed"

    - name: Report APK download result
      run: |
        echo "=== DIRECT APK DOWNLOAD & ARTIFACT INFO ===" >> $GITHUB_STEP_SUMMARY
        echo "1. GitHub Actions Artifacts: Go to the 'Actions' tab in your repository, click on the latest workflow run, and download the 'app-debug-apk' artifact (ZIP file containing app-debug.apk)." >> $GITHUB_STEP_SUMMARY
        echo "2. GitHub Releases: https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
